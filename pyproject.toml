[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus-protocol"
version = "0.1.0"
description = "A verifiable, reversible, self-improving learning runtime."
readme = "README.md"
requires-python = ">=3.10"
# Proprietary (PEP 639 license expression). The in-repo LICENSE is a placeholder
# notice; commercial terms are a separate agreement. History in
# docs/LICENSE-HISTORY.md.
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "DriivAIDev", email = "will@driivai.com" }]
keywords = [
    "verifiable",
    "reproducible",
    "evaluation",
    "skills",
    "promotion-gate",
    "held-out",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "psycopg[binary]>=3.2,<4",
    # Asymmetric approval signing (ECDSA P-256) for the external-signer path
    # (docs/key-custody.md). Standard-library Python has no asymmetric
    # primitives, and implementing one here would be the wrong kind of custody.
    "cryptography>=41",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.0", "mypy>=1.11", "PyYAML>=6.0", "types-PyYAML>=6.0"]

[project.scripts]
prometheus-protocol = "prometheus_protocol.cli.main:main"
promethyn-reconcile = "prometheus_protocol.cli.reconcile:main"

[project.urls]
Homepage = "https://github.com/driivai/promethyn"
Source = "https://github.com/driivai/promethyn"
Issues = "https://github.com/driivai/promethyn/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
