name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: appdb
          POSTGRES_USER: migrator
          POSTGRES_PASSWORD: chokepoint-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migrator -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so origin/main is resolvable. Several conformance
          # tests assert the Hearth (and default-judge path) are byte-identical to
          # main by diffing against origin/main; under the default shallow checkout
          # (fetch-depth 1) origin/main is absent and those tests SILENTLY SKIP —
          # the "Hearth unchanged" guard then never runs in CI. fetch-depth: 0
          # makes them run.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable + dev extra)
        run: python -m pip install -e ".[dev]" -c constraints.txt

      - name: Compile
        run: python -m compileall -q src tests scripts

      - name: Trusted core and F11 type gate
        # EX-1: "could not execute" is a distinct type (core.models.Unavailable)
        # that carries no `verdict`, so an authoritative verifier that could not
        # run can never be narrowed into a verdict. That guarantee is only real if
        # a checker enforces it — a type contract that never runs is the exact
        # class of bug EX-1 fixes — so it runs here and the build FAILS if the
        # Hearth does not type-check. mypy.ini pins the core and F11 files (and
        # `mypy_path=src` so the real types resolve and the gate has teeth); the
        # rest of the repo is not checked here (no yak-shaving).
        run: python -m mypy --config-file mypy.ini

      - name: Repository hygiene
        run: python scripts/check_hygiene.py

      - name: F11 persistence, source and reconciliation proofs (must execute, zero skips)
        run: |
          python -m pytest -q tests/chokepoint/test_authorization_record.py tests/chokepoint/test_audit_source.py tests/chokepoint/test_reconciliation.py --junitxml=f11-proofs.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("f11-proofs.xml").iter("testcase"))
          # Each of the three files must contribute cases, and the count is
          # printed per file: an empty or partial collection that passed
          # silently is the void-guard shape this gate exists to prevent.
          for module in ("test_authorization_record", "test_audit_source", "test_reconciliation"):
              collected = [c for c in cases if c.get("classname", "").endswith(module)]
              assert collected, f"{module} proofs did not execute"
              print(f"F11 {module}: {len(collected)} proofs collected and executed")
          assert all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error")), "F11 proof skipped or failed"
          print(f"F11: {len(cases)} proofs executed; zero skips/failures/errors")
          PY

      - name: F11 source guard reverts (must be caught)
        run: python scripts/f11_source_revert_proofs.py

      - name: F11 reconciliation guard reverts (must be caught)
        run: python scripts/f11_reconcile_revert_proofs.py

      - name: PROM-FIX-B guard reverts (strict booleans, lock identity, header syntax; must be caught)
        run: python scripts/fix_b_revert_proofs.py

      - name: IP consistency (owner, license, no stray former license)
        # What a prime's counsel verifies by hand (docs/IP-READINESS.md §7),
        # verified on every build. The --history mode, which requires the
        # canonical identity on every commit reachable from main, is enabled
        # once the provenance rewrite has run (docs/repository-identity.md §4).
        run: python scripts/check_ip_consistency.py

      - name: PostgreSQL chokepoint live tests (must run, never skip)
        # Runs the agent-isolation proof too. It used to gate on
        # PROM_CHOKEPOINT_PG_SOCKDIR, which this workflow sets nowhere and a
        # containerised database cannot provide — so the repository's
        # load-bearing "unreachable by every path" proof silently SKIPPED on
        # every CI run. -rs prints the skip list, so a proof that stops running
        # is visible instead of invisible.
        env:
          PROM_REQUIRE_PG: "1"
          PROM_CHOKEPOINT_PG_HOST: 127.0.0.1
          PROM_CHOKEPOINT_PG_PORT: "5432"
          PROM_CHOKEPOINT_PG_DB: appdb
          PROM_CHOKEPOINT_PG_USER: migrator
          PROM_CHOKEPOINT_PG_PASSWORD: chokepoint-ci-password
          PROM_CHOKEPOINT_PG_SCHEMA: public
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          python -m pytest -q -rs \
            tests/chokepoint/test_migration_live.py \
            tests/chokepoint/test_isolation.py

      - name: Enable unprivileged user namespaces (for the namespace sandbox)
        # Ubuntu 24.04 runners restrict unprivileged user namespaces via
        # AppArmor; lift it so the daemonless namespace adapter can isolate.
        # Tolerant of kernels/images without these knobs.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Sandbox conformance (isolation must run, not skip)
        env:
          PROM_REQUIRE_SANDBOX: "1"
        run: python -m pytest -q tests/conformance -k sandbox

      - name: Cross-user workspace denial (must RUN as root, not skip)
        # Proving that another local account is refused requires privilege to
        # drop privilege, so on an unprivileged runner this test skips — and a
        # security test that skips is a void guard (see threat model §1, A1-4).
        # Run that one test under sudo, with PROM_REQUIRE_PRIVILEGED=1 so a skip
        # fails the build instead of passing quietly.
        run: |
          sudo -E "$(command -v python)" -m pytest -rA -v \
            tests/conformance/test_sandbox_privilege.py \
            -k another_local_user
        env:
          PROM_REQUIRE_PRIVILEGED: "1"

      - name: Hearth guards must EXECUTE, not skip (fetch-depth 0 makes origin/main resolvable)
        # The four Hearth/default-judge byte-identical tests skipif origin/main is
        # unresolvable — TRUE under the old shallow checkout, so they silently
        # skipped in CI. -v -rs makes their execution visible by name and shows the
        # SKIPPED list (they must not appear in it).
        run: python -m pytest -v -rs -k hearth tests/conformance

      - name: Test
        env:
          # Fail rather than skip the sandbox conformance tests if the isolation
          # runtime is missing, so green here always means isolation was proven.
          PROM_REQUIRE_SANDBOX: "1"
        run: python -m pytest -q

      - name: Build
        run: python -m build
