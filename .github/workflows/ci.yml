name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: appdb
          POSTGRES_USER: migrator
          POSTGRES_PASSWORD: chokepoint-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migrator -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. This was added because the Hearth guards diffed against
          # origin/main and SILENTLY SKIPPED when it was unresolvable under the
          # default shallow checkout; those guards now compare content digests
          # and need no branch at all. It stays for the provenance check
          # (check_ip_consistency.py --history walks every commit reachable from
          # the branch) and so a shallow checkout cannot quietly re-enter as a
          # reason some later guard cannot run.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable + dev extra)
        run: python -m pip install -e ".[dev]" -c constraints.txt

      - name: Compile
        run: python -m compileall -q src tests scripts

      - name: Whole-tree type gate
        # EX-1: "could not execute" is a distinct type (core.models.Unavailable)
        # that carries no `verdict`, so an authoritative verifier that could not
        # run can never be narrowed into a verdict. That guarantee is only real if
        # a checker enforces it — a type contract that never runs is the exact
        # class of bug EX-1 fixes.
        #
        # This step used to check an ENTRY-POINT LIST of files. An independent
        # review then reproduced eleven crashes and one authorization fail-open;
        # every one was already visible to mypy, and they shipped because five of
        # the affected files were outside that list. mypy.ini now checks the WHOLE
        # of src/prometheus_protocol, this step runs it on all three supported
        # Pythons, and the build FAILS on any diagnostic.
        #
        # It runs through scripts/type_gate.py rather than invoking mypy directly,
        # because a later review turned the direct invocation off with one line —
        # `true || python -m mypy ...` contains the command and never runs it. The
        # runner prints the checker version (pyproject allows a RANGE, and #87 was
        # green on 2.3.1 while a review's 1.20.2 found a real defect), refuses a
        # run that checked fewer files than its floor, and writes a receipt that
        # the next step demands. Presence is not execution.
        run: python scripts/type_gate.py

      - name: Type gate receipt (the gate must have EXECUTED, not merely existed)
        # The half of the proof that cannot be spelled around: no receipt means
        # the gate step did not run, however that was arranged. Also refuses a
        # receipt whose recorded config digest does not match mypy.ini on disk.
        run: python scripts/check_type_gate_receipt.py

      - name: Repository hygiene
        run: python scripts/check_hygiene.py

      - name: Linux mount-metadata compatibility (observed distribution)
        # Prints the shape of this runner's real mount table per row — driver,
        # mount-root format class, whether the parser reads it — so recognition
        # is expanded from what the runners have, not from a guessed list. Also
        # the gate: this checkout's directories must verify under the strictest
        # policy, and no unreadable row relevant to them may pass.
        run: python scripts/mountinfo_diagnostic.py

      - name: F11 persistence, source and reconciliation proofs (must execute, zero skips)
        run: |
          python -m pytest -q tests/chokepoint/test_authorization_record.py tests/chokepoint/test_audit_source.py tests/chokepoint/test_reconciliation.py --junitxml=f11-proofs.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("f11-proofs.xml").iter("testcase"))
          # Each of the three files must contribute cases, and the count is
          # printed per file: an empty or partial collection that passed
          # silently is the void-guard shape this gate exists to prevent.
          for module in ("test_authorization_record", "test_audit_source", "test_reconciliation"):
              collected = [c for c in cases if c.get("classname", "").endswith(module)]
              assert collected, f"{module} proofs did not execute"
              print(f"F11 {module}: {len(collected)} proofs collected and executed")
          assert all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error")), "F11 proof skipped or failed"
          print(f"F11: {len(cases)} proofs executed; zero skips/failures/errors")
          PY

      - name: F11 source guard reverts (must be caught)
        run: python scripts/f11_source_revert_proofs.py

      - name: F11 reconciliation guard reverts (must be caught)
        run: python scripts/f11_reconcile_revert_proofs.py

      - name: PROM-FIX-B guard reverts (strict booleans, lock identity, header syntax; must be caught)
        run: python scripts/fix_b_revert_proofs.py

      - name: Opened substrate proofs (exact collection, zero skips)
        run: |
          python -m pytest -q tests/chokepoint/test_substrate.py tests/chokepoint/test_opened_substrate.py tests/chokepoint/test_mount_relevance.py tests/chokepoint/test_mount_root_formats.py tests/conformance/test_substrate_revert_pins.py --junitxml=substrate-proofs.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("substrate-proofs.xml").iter("testcase"))
          expected = {"test_substrate": 57, "test_opened_substrate": 49,
                      "test_mount_relevance": 30, "test_mount_root_formats": 32,
                      "test_substrate_revert_pins": 2}
          for module, count in expected.items():
              actual = sum(c.get("classname", "").endswith(module) for c in cases)
              assert actual == count, (module, actual, count)
          assert len(cases) == sum(expected.values())
          assert all(c.find(t) is None for c in cases for t in ("skipped", "failure", "error"))
          print(f"Opened substrate: {len(cases)} proofs; zero skips/failures/errors")
          PY

      - name: Opened substrate guard reverts (exact failure counts)
        run: python scripts/substrate_revert_proofs.py

      - name: Config attestation proofs (exact collection, zero skips)
        run: |
          python -m pytest -q tests/conformance/test_config_attestation.py tests/conformance/test_pih4a_revert_pins.py --junitxml=attestation-proofs.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("attestation-proofs.xml").iter("testcase"))
          expected = {"test_config_attestation": 87, "test_pih4a_revert_pins": 2}
          for module, count in expected.items():
              actual = sum(c.get("classname", "").endswith(module) for c in cases)
              assert actual == count, (module, actual, count)
          assert len(cases) == sum(expected.values())
          assert all(c.find(t) is None for c in cases for t in ("skipped", "failure", "error"))
          print(f"Config attestation: {len(cases)} proofs; zero skips/failures/errors")
          PY

      - name: Config attestation guard reverts (must be caught)
        run: python scripts/pih4a_revert_proofs.py

      - name: PROD-FIX-1 proofs (approval expiry, attestation chronology, hostname taxonomy)
        # F7's phase table, P-1's equal-time and rollback cases, and P-2's
        # hostname normalisation. Pinned by exact collection per module and zero
        # skips: none of these needs a database or a privileged host, so a skip
        # here would mean a proof stopped running, not that the environment
        # lacked something. (The PostgreSQL-backed half of F7's second admission
        # boundary lives in the live step below, where PROM_REQUIRE_PG=1 turns a
        # skip into a failure.)
        run: |
          python -m pytest -q \
            tests/chokepoint/test_approval_expiry_across_preparation.py \
            tests/conformance/test_attestation_chronology.py \
            tests/conformance/test_unicode_hostname_taxonomy.py \
            tests/conformance/test_prod_fix_1_revert_pins.py \
            --junitxml=prod-fix-1.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("prod-fix-1.xml").iter("testcase"))
          expected = {"test_approval_expiry_across_preparation": 46,
                      "test_attestation_chronology": 14,
                      "test_unicode_hostname_taxonomy": 30,
                      "test_prod_fix_1_revert_pins": 5}
          for module, count in expected.items():
              actual = sum(c.get("classname", "").endswith(module) for c in cases)
              assert actual == count, (module, actual, count)
          assert len(cases) == sum(expected.values())
          assert all(c.find(t) is None for c in cases for t in ("skipped", "failure", "error"))
          print(f"PROD-FIX-1: {len(cases)} proofs; zero skips/failures/errors")
          PY

      - name: PROD-FIX-1 guard reverts (must be caught)
        run: python scripts/prod_fix_1_revert_proofs.py

      - name: PROD-FIX-2 proofs (F8 — no secret reaches a public string)
        # The canary sweep is the load-bearing half: one token through the
        # credential fields and a reflecting endpoint that echoes it in a 4xx
        # body, a 5xx body, a 200 body, a response header and a redirect
        # hostname, asserted absent from every discovered surface. The sink
        # regressions are the diagnostic half — a sweep failure says "the canary
        # is in the ledger file", these say which fix came back.
        #
        # Pinned by exact collection per module and zero skips. Every test here
        # runs on a loopback HTTP server and SQLite: nothing needs a database, a
        # network or a privileged host, so a skip would mean a proof stopped
        # running rather than an environment lacking something. The one
        # importorskip is on psycopg, which is a hard dependency of this job.
        run: |
          python -m pytest -q \
            tests/conformance/test_secret_canary_sweep.py \
            tests/conformance/test_secret_sink_regressions.py \
            tests/conformance/test_prod_fix_2_revert_pins.py \
            --junitxml=prod-fix-2.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("prod-fix-2.xml").iter("testcase"))
          expected = {"test_secret_canary_sweep": 35,
                      "test_secret_sink_regressions": 16,
                      "test_prod_fix_2_revert_pins": 6}
          for module, count in expected.items():
              actual = sum(c.get("classname", "").endswith(module) for c in cases)
              assert actual == count, (module, actual, count)
          assert len(cases) == sum(expected.values())
          assert all(c.find(t) is None for c in cases for t in ("skipped", "failure", "error"))
          print(f"PROD-FIX-2: {len(cases)} proofs; zero skips/failures/errors")
          PY

      - name: PROD-FIX-2 guard reverts (must be caught)
        run: python scripts/prod_fix_2_revert_proofs.py

      - name: PHASE-1.2a proofs (requirement coverage enforced before fusion)
        # The trusted verification-policy model. The load-bearing test is the
        # essential regression: a required executable check MISSING plus a
        # structural HARD PASS must refuse, with no approval and zero executor
        # calls, driven through the real swarm runtime with the real bank, gate
        # and executor. The ten-row fault matrix is beside it.
        #
        # Pinned by exact collection per module and zero skips. Every test here
        # runs in-process on SQLite and an in-memory trust store. No matrix row
        # needs a container: the two timeout rows drive the real
        # SubprocessVerifier through a sandbox stub that reports a wall-clock
        # timeout with candidate_started set either way, the no-isolation row
        # uses NullSandbox, and the positive control uses UnsafeLocalSandbox
        # deliberately (its "candidate" is a four-character arithmetic fixture
        # this repository authored). So every row is deterministic on every host,
        # and a skip here would mean a proof stopped running rather than an
        # environment lacking something.
        run: |
          python -m pytest -q \
            tests/conformance/test_bound_requirements_encoding.py \
            tests/conformance/test_coverage_enforcement.py \
            tests/conformance/test_policy_enforcement_regression.py \
            tests/conformance/test_no_second_aggregator.py \
            tests/conformance/test_phase_1_2a_revert_pins.py \
            --junitxml=phase-1-2a.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("phase-1-2a.xml").iter("testcase"))
          expected = {"test_bound_requirements_encoding": 21,
                      "test_coverage_enforcement": 33,
                      "test_policy_enforcement_regression": 19,
                      # PHASE-1.2b — 9 -> 11. Closing the unbound-judgment route
                      # moved the interesting capability from constructing a
                      # verdict to MINTING an assessment, so the 2d guard gained
                      # a second sweep (permitted minters, and its staleness
                      # check). Re-pinned in the same change that added them.
                      "test_no_second_aggregator": 11,
                      "test_phase_1_2a_revert_pins": 7}
          for module, count in expected.items():
              actual = sum(c.get("classname", "").endswith(module) for c in cases)
              assert actual == count, (module, actual, count)
          assert len(cases) == sum(expected.values())
          assert all(c.find(t) is None for c in cases for t in ("skipped", "failure", "error"))
          print(f"PHASE-1.2a: {len(cases)} proofs; zero skips/failures/errors")
          PY

      - name: PHASE-1.2a guard reverts (must be caught)
        run: python scripts/phase_1_2a_revert_proofs.py

      - name: PHASE-1.2b proofs (the unbound-judgment route is closed)
        # The load-bearing test is that a raw authoritative Judgment cannot be
        # PRESENTED to any authorization surface — not that it is presented and
        # rejected. Four surfaces, including the migration approval authority
        # that mints a signed capability against a privileged database
        # principal. Every refusal has a positive control beside it, so the
        # sprint cannot pass by breaking everything.
        #
        # Pinned by exact collection per module and zero skips. Everything runs
        # in-process on SQLite and an in-memory trust store.
        run: |
          python -m pytest -q \
            tests/conformance/test_unbound_authorization_closed.py \
            tests/conformance/test_phase_1_2b_revert_pins.py \
            --junitxml=phase-1-2b.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("phase-1-2b.xml").iter("testcase"))
          expected = {"test_unbound_authorization_closed": 18,
                      "test_phase_1_2b_revert_pins": 6}
          for module, count in expected.items():
              actual = sum(c.get("classname", "").rsplit(".", 1)[0].endswith(module)
                           or module in c.get("classname", "") for c in cases)
              assert actual == count, (module, actual, count)
          assert len(cases) == sum(expected.values())
          assert all(c.find(t) is None for c in cases for t in ("skipped", "failure", "error"))
          print(f"PHASE-1.2b: {len(cases)} proofs; zero skips/failures/errors")
          PY

      - name: PHASE-1.2b guard reverts (must be caught)
        run: python scripts/phase_1_2b_revert_proofs.py

      - name: PHASE-1.2 CHECKPOINT 3 proofs (advisory evidence cannot satisfy)
        # The measured gap: validate_coverage was tier-blind, so a policy naming
        # any advisory implementation made advisory evidence sufficient for
        # coverage. Correct for R2 (what is REQUIRED is keyed by check identity)
        # and wrong for the separate question of what COUNTS as satisfying one.
        #
        # The rule is over what the evidence IS, never over what it is called:
        # two of the three soft-lever wrappers derive their identity at
        # construction, so an identity rule would be a rule over spellings.
        # Every refusal here has a positive control beside it.
        run: |
          python -m pytest -q \
            tests/conformance/test_advisory_cannot_satisfy.py \
            tests/conformance/test_phase_1_2c_revert_pins.py \
            --junitxml=checkpoint-3.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("checkpoint-3.xml").iter("testcase"))
          expected = {"test_advisory_cannot_satisfy": 22,
                      "test_phase_1_2c_revert_pins": 6}
          for module, count in expected.items():
              actual = sum(module in c.get("classname", "") for c in cases)
              assert actual == count, (module, actual, count)
          assert len(cases) == sum(expected.values())
          assert all(c.find(t) is None for c in cases for t in ("skipped", "failure", "error"))
          print(f"CHECKPOINT 3: {len(cases)} proofs; zero skips/failures/errors")
          PY

      - name: PHASE-1.2 CHECKPOINT 3 guard reverts (must be caught)
        run: python scripts/phase_1_2c_revert_proofs.py

      - name: PHASE-1.2c Checkpoint B execution-descriptor proofs
        run: |
          python -m pytest -q \
            tests/conformance/test_execution_descriptor.py \
            tests/conformance/test_phase_1_2c_checkpoint_b_revert_pins.py \
            --junitxml=execution-descriptor.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("execution-descriptor.xml").iter("testcase"))
          assert len(cases) == 16, f"16 descriptor proofs required; observed {len(cases)}"
          assert all(c.find(t) is None for c in cases for t in ("skipped", "failure", "error"))
          print("Checkpoint B: 16 proofs; zero skips/failures/errors")
          PY

      - name: PHASE-1.2c Checkpoint B seam mutations (must be caught)
        run: python scripts/phase_1_2c_checkpoint_b_revert_proofs.py

      - name: The bank decision surface has not moved
        # verifier/bank.py came out from under its net-diff-empty guard in this
        # sprint. judge() is UNCHANGED and this is what says so: 240 enumerated
        # decisions against the checked-in table. A move here is reconciled
        # deliberately, in the same change, with the reason.
        run: python -m pytest -q tests/conformance/test_bank_decision_surface.py

      - name: Union-handling proofs (exact test NAMES, zero skips)
        # A type fix that satisfies mypy but still crashes at runtime is a void
        # guard: mypy proves the Unavailable branch is WRITTEN, not that it is
        # reached or that it produces a sensible outcome. These drive each crash
        # site the independent review reproduced with a REAL Unavailable — a real
        # verifier over a provider that times out, or over an isolation runtime
        # that refuses to start — and assert a structured non-crash outcome.
        #
        # Pinned by NAME, not by count. A count catches deletion but not
        # delete-one-add-one: drop the planted-defect proof, add a trivial
        # passing test, and the number is unchanged. The manifest names every
        # test, so a removed or renamed proof fails the build and an added one
        # has to be added deliberately.
        #
        # On host requirements: the NEGATIVE tests need no isolation runtime,
        # because the fault under test IS the runtime being absent. The POSITIVE
        # control uses UnsafeLocalSandbox explicitly — deterministic on every
        # host, and appropriate because its "candidate" is a two-line arithmetic
        # fixture the test itself wrote, not an untrusted proposal. Isolation is
        # still demanded by the tests that verify isolation, in the sandbox suite.
        run: |
          python -m pytest -q tests/conformance/test_unavailable_consumers_do_not_crash.py tests/conformance/test_type_gate.py tests/conformance/test_type_gate_revert_pins.py --junitxml=type-gate-proofs.xml
          python scripts/check_type_gate_manifest.py type-gate-proofs.xml

      - name: Union-narrowing reverts (must be caught)
        run: python scripts/type_gate_revert_proofs.py

      - name: Type gate at the declared floor of the supported checker range
        # The step NAME deliberately does not contain the checker's name: the
        # voidguard scan parses workflow step names for type-check invocations,
        # and read "... supported mypy range" as a mypy run whose target path is
        # `range` — a VOID finding for a path matching no files. The finding was
        # wrong about this step but right about the shape it looks for (a type
        # gate over nothing is always green), so the name is changed rather than
        # the scan suppressed.
        #
        # pyproject declares `mypy>=1.11`; constraints.txt pins 2.3.1 and CI
        # installs under it, so every build so far exercised only the newest
        # checker in the range. #87 was green that way while an independent
        # review's 1.20.2 — also inside the declared range — reported a real
        # union-attr defect nobody in CI could see.
        #
        # This runs the same gate against the floor, in an isolated venv so the
        # pinned closure is untouched. A diagnostic that only the floor reports
        # now fails the build here instead of surfacing in someone else's
        # review. The floor is raised deliberately (see docs/DEPENDENCY-LICENSES)
        # and never to make a diagnostic go away — 1.20.2, the checker that
        # found the defect, stays inside the supported range.
        run: python scripts/type_gate_floor.py

      - name: IP consistency (owner, license, no stray former license)
        # What a prime's counsel verifies by hand (docs/IP-READINESS.md §7),
        # verified on every build. The --history mode, which requires the
        # canonical identity on every commit reachable from main, is enabled
        # once the provenance rewrite has run (docs/repository-identity.md §4).
        run: python scripts/check_ip_consistency.py

      - name: PostgreSQL chokepoint live tests (must run, never skip)
        # Runs the agent-isolation proof too. It used to gate on
        # PROM_CHOKEPOINT_PG_SOCKDIR, which this workflow sets nowhere and a
        # containerised database cannot provide — so the repository's
        # load-bearing "unreachable by every path" proof silently SKIPPED on
        # every CI run. -rs prints the skip list, so a proof that stops running
        # is visible instead of invisible.
        env:
          PROM_REQUIRE_PG: "1"
          PROM_CHOKEPOINT_PG_HOST: 127.0.0.1
          PROM_CHOKEPOINT_PG_PORT: "5432"
          PROM_CHOKEPOINT_PG_DB: appdb
          PROM_CHOKEPOINT_PG_USER: migrator
          PROM_CHOKEPOINT_PG_PASSWORD: chokepoint-ci-password
          PROM_CHOKEPOINT_PG_SCHEMA: public
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          python -m pytest -q -rs \
            tests/chokepoint/test_migration_live.py \
            tests/chokepoint/test_isolation.py

      - name: Enable unprivileged user namespaces (for the namespace sandbox)
        # Ubuntu 24.04 runners restrict unprivileged user namespaces via
        # AppArmor; lift it so the daemonless namespace adapter can isolate.
        # Tolerant of kernels/images without these knobs.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Sandbox conformance (isolation must run, not skip)
        env:
          PROM_REQUIRE_SANDBOX: "1"
        run: python -m pytest -q tests/conformance -k sandbox

      - name: Linux opened-store and lock mount integration (must run, zero skips)
        run: |
          python -m pytest -q tests/chokepoint/test_substrate_linux.py --junitxml=substrate-linux.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("substrate-linux.xml").iter("testcase"))
          # Six from the 1A/1B sprint, plus SUBSTRATE-ROBUST's deleted-source
          # case, which produces the "//deleted" mount root on this very host
          # rather than asserting a fixture of it.
          assert len(cases) == 7, f"seven Linux cases required; observed {len(cases)}"
          assert all(c.find(t) is None for c in cases for t in ("skipped", "failure", "error"))
          print("Linux opened substrate: 7 cases executed; zero skips/failures/errors")
          PY

      - name: Cross-user workspace denial (must RUN as root, not skip)
        # Proving that another local account is refused requires privilege to
        # drop privilege, so on an unprivileged runner this test skips — and a
        # security test that skips is a void guard (see threat model §1, A1-4).
        # Run that one test under sudo, with PROM_REQUIRE_PRIVILEGED=1 so a skip
        # fails the build instead of passing quietly.
        run: |
          sudo -E "$(command -v python)" -m pytest -rA -v \
            tests/conformance/test_sandbox_privilege.py \
            -k another_local_user
        env:
          PROM_REQUIRE_PRIVILEGED: "1"

      - name: Hearth content guards must EXECUTE, not skip
        # The four Hearth/default-judge guards used to skipif origin/main was
        # unresolvable — TRUE under the old shallow checkout, so they silently
        # skipped in CI. They no longer consult git at all: they compare each
        # frozen file's bytes against the sanctioned digest in
        # tests/conformance/hearth_ledger.py, so there is no branch to resolve
        # and no predicate to skip on. The step stays because -v -rs makes their
        # execution visible by name and shows the SKIPPED list (they must not
        # appear in it), which is the property that was actually load-bearing.
        run: python -m pytest -v -rs -k hearth tests/conformance

      - name: Test
        env:
          # Fail rather than skip the sandbox conformance tests if the isolation
          # runtime is missing, so green here always means isolation was proven.
          PROM_REQUIRE_SANDBOX: "1"
        run: python -m pytest -q

      - name: Build
        run: python -m build
