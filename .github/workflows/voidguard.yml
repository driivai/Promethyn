name: voidguard

# Dogfood: scan this repository — the scanner's origin — with the extracted
# voidguard, blocking decisive VOID findings. WARN/UNKNOWN remain visible,
# not a claim of complete verification. The scanner's own fixture suite and gated self-scan
# live in its own repository's CI now (github.com/driivai/voidguard).
#
# The install is PINNED to the exact reviewed extraction commit — the same
# posture this repo demands of container images (a floating ref can be
# repointed after review; a pinned one cannot). A green install is therefore
# also the byte-for-byte proof that the standalone repo carries the approved
# history. Bump the pin deliberately when the standalone repo advances.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/voidguard.yml"
      - "tools/voidguard/**"
      - "src/prometheus_protocol/chokepoint/audit_*.py"
      - "tests/chokepoint/test_audit_source.py"
      - "scripts/f11_source_revert_proofs.py"
      - "src/prometheus_protocol/chokepoint/reconcil*.py"
      - "src/prometheus_protocol/cli/reconcile.py"
      - "tests/chokepoint/test_reconciliation.py"
      - "scripts/f11_reconcile_revert_proofs.py"
      - "scripts/fix_b_revert_proofs.py"
      - "scripts/substrate_revert_proofs.py"
      - "src/prometheus_protocol/chokepoint/substrate.py"
      - "src/prometheus_protocol/chokepoint/runner.py"
      - "src/prometheus_protocol/chokepoint/authorization_journal.py"
      - "tests/chokepoint/test_*substrate*.py"
      - "tests/chokepoint/test_mount_relevance.py"
      - "scripts/mountinfo_diagnostic.py"
      - "scripts/pih4a_revert_proofs.py"
      - "src/prometheus_protocol/attestation/**"
      - "tests/conformance/test_config_attestation.py"
      - "scripts/prod_fix_1_revert_proofs.py"
      # F8. The scan looks for guards that cannot fail; a secret sweep that
      # discovers nothing, or a reason-code allowlist that refuses nothing, is
      # exactly that shape, and both are new here.
      - "scripts/prod_fix_2_revert_proofs.py"
      - "src/prometheus_protocol/core/secrets.py"
      - "src/prometheus_protocol/core/diagnostics.py"
      - "tests/conformance/test_secret_canary_sweep.py"
      - "tests/conformance/test_secret_sink_regressions.py"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install voidguard (standalone repository, pinned to the reviewed commit)
        run: pip install "voidguard @ git+https://github.com/driivai/voidguard@d371f9cd18eb880b3e49336134c476136ee515d2"

      - name: Scan (no VOID findings)
        run: voidguard scan . --fail-on void --json voidguard-report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: voidguard-dogfood-report
          path: voidguard-report.json
