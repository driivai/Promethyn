name: voidguard

# Dogfood: scan this repository — the scanner's origin — with the extracted
# voidguard, blocking decisive VOID findings. WARN/UNKNOWN remain visible,
# not a claim of complete verification. The scanner's own fixture suite and gated self-scan
# live in its own repository's CI now (github.com/driivai/voidguard).
#
# The install is PINNED to the exact reviewed extraction commit — the same
# posture this repo demands of container images (a floating ref can be
# repointed after review; a pinned one cannot). A green install is therefore
# also the byte-for-byte proof that the standalone repo carries the approved
# history. Bump the pin deliberately when the standalone repo advances.

# WHY THERE IS NO `paths:` FILTER ANY MORE.
#
# This job used to run only when a PR touched one of ~35 enumerated paths. That
# is an allowlist over the thing that varies — which files a change happens to
# touch — and its failure mode is silent: a PR touching nothing on the list got
# NO SCAN AT ALL and still showed every check green. An absent scan is
# Unavailable, not clean, and this repository's own doctrine is that
# couldn't-verify is never verified-clean. The filter made the instrument
# report "clean" for runs where it had not looked.
#
# The list was also stale by construction: every sprint that added a guard had
# to remember to add its path, and a forgotten entry disarmed the scan for
# exactly the new code it was meant to cover. It now runs on every pull request.
#
# RE-SANCTIONED COUNTS, WITH THE RATIONALE RATHER THAN JUST THE NUMBERS.
# The last observed summary was `0 VOID, 3 WARN, 2 UNKNOWN`. Two things move it:
#
#  * The platform gate (PROM_REQUIRE_LINUX) adds skip conditions, and VG-1-001
#    aggregates skipif guards as UNKNOWN with the objection: "for capability
#    probes, ensure at least one CI job provides the capability and would FAIL
#    (not skip) without it." That objection is ANSWERED here rather than
#    suppressed: ci.yml sets PROM_REQUIRE_LINUX=1 on the build job, under which
#    a gated test that cannot run is a FAILURE, not a skip. The UNKNOWN may
#    still be reported — it is a static finding and the answer is dynamic — and
#    it is accepted on that basis, not baselined away.
#  * Running on every PR means the scan now covers PRs it previously skipped, so
#    a count that only ever came from filtered runs was never the whole picture.
#
# Only VOID blocks. WARN and UNKNOWN stay visible and are not a claim of
# complete verification.
#
# THE THREE POSTGRES_* WARNINGS, CLASSIFIED. VG-3-001/002/003 report
# POSTGRES_DB, POSTGRES_USER and POSTGRES_PASSWORD in ci.yml as "set and read
# nowhere". They are NOT dead config: they sit under `services.postgres.env` and
# are consumed by the postgres image's own entrypoint, which is outside the 297
# repo files the scan searches. The finding is a true observation with a reader
# the scanner cannot see.
#
# There is a real coupling underneath it, which is worth more than the warning:
# those three values are duplicated by PROM_CHOKEPOINT_PG_DB / _USER / _PASSWORD
# on the live-migration step, and the two sets must agree or the live proofs
# cannot connect. Nothing enforces that agreement today — a wiring gap rather
# than dead config, and named here rather than closed, because closing it means
# deciding where the single source of those values should live.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install voidguard (standalone repository, pinned to the reviewed commit)
        run: pip install "voidguard @ git+https://github.com/driivai/voidguard@d371f9cd18eb880b3e49336134c476136ee515d2"

      - name: Scan (no VOID findings)
        run: voidguard scan . --fail-on void --json voidguard-report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: voidguard-dogfood-report
          path: voidguard-report.json
