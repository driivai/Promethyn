# The type gate: the WHOLE source tree, and the build fails on any diagnostic.
#
# Why this is whole-tree and not a file list. EX-1 makes "could not execute" a
# distinct type (``core.models.Unavailable``) that carries no ``verdict``, so an
# authoritative verifier that could not run can never be narrowed into a
# verdict. Reading ``.verdict`` on an ``Evidence | Unavailable`` is a mypy
# ``[union-attr]`` error until the ``Unavailable`` branch is handled — the
# checker has always known. It was not asked: this file used to name an
# entry-point list of 22 modules, and an independent review then reproduced
# eleven crashes and one authorization fail-open, every one of them in a file
# OUTSIDE that list and every one of them already visible to mypy.
#
# So the gate now covers ``src/prometheus_protocol`` entire, and CI runs it on
# every supported Python. The point is not the diagnostics it cleared once; it
# is that the next consumer who forgets to narrow the union cannot merge.
#
# ``mypy_path`` + ``explicit_package_bases`` make the real prometheus types
# resolve (without them ``ignore_missing_imports`` degraded them to ``Any`` and
# the gate was toothless — a mistake we caught and closed).
#
# ``ignore_missing_imports`` IS NOW OFF, which closes OPEN-GAPS G1. While it was
# True it swallowed two things besides genuine third-party packages: a
# first-party sibling import mypy could not resolve (scripts and tests importing
# each other), and a standard-library module that does not exist at the pinned
# floor — which is how ``import tomllib`` passed the gate on all three matrix
# jobs and failed at import on 3.10.
#
# Closing it needed no per-module ``[mypy-...]`` sections, which
# ``test_type_gate.py`` forbids. It needed ``mypy_path`` widened to the roots
# those siblings actually live under. Measured before the change: 28 errors in
# 27 files at 304 checked, every one ``import-not-found``, none third-party.
# Measured after, on the same tree: zero.
#
# THE TRADE, stated rather than discovered later: with the flag off, the gate
# now depends on every third-party dependency shipping types (or a stub being
# available). A new dependency without them fails this gate rather than being
# silently ``Any``. That is the intended direction — silent ``Any`` is what
# made the gate toothless — but it is a real cost at the next dependency bump,
# and it is why this was its own change rather than a rider on a load-bearing
# one.
#
# NO per-module ignore sections, and no ``disallow_*=False`` carve-outs. A
# carve-out that hides a ``union-attr`` finding would be this gate failing at
# its own job, and ``tests/conformance/test_type_gate.py`` fails the build if
# one is added or if ``files`` is narrowed back to a list.
#
# ``warn_unused_ignores`` and ``warn_redundant_casts`` are on so the two
# shortcuts this sprint forbids — a stale ignore directive and a ``cast()`` that
# silences rather than resolves — cannot sit unnoticed. In fact the tree now
# carries NEITHER: the eight ignore directives that predated this sprint were
# each an interface that did not say what it meant, and all eight were resolved
# rather than kept. ``test_type_gate.py`` pins that at zero.

# WHAT THIS DOES NOT CHECK, stated with the measurement rather than left to be
# discovered. ``check_untyped_defs`` is OFF, so the bodies of UNANNOTATED
# functions are not checked — which in practice means most pytest test bodies.
# That is why the gate covering ``tests`` catches 64 diagnostics and not 469.
# Measured on 2026-09-09 by turning it on: 405 diagnostics in tests/, 11 in
# scripts/, 11 in src/ (the src ones concentrated in ``core/transport.py``,
# which deliberately subclasses CPython's ``http.client`` internals). Turning it
# on is a separate change with its own risk; the number is here so that decision
# sits on the record instead of being re-argued from scratch.
#
# The two unnarrowed ``.verdict`` dereferences an independent review found in
# tests/ were behind exactly this limit, and are fixed directly rather than left
# waiting for it to lift.

[mypy]
# THE SUPPORTED FLOOR, pinned — not the interpreter's own version.
#
# Unpinned, mypy targets whatever Python it is running under. The gate runs in
# every matrix job, so 3.10 was nominally covered; what that misses is that
# `ignore_missing_imports = True` (below, for genuine third-party packages)
# also swallows a STDLIB module that does not exist on the target version. So
# `import tomllib` — standard library only from 3.11 — passed the gate on all
# three runners and then failed at import on 3.10, in CI, after review.
#
# Pinned to the floor, mypy evaluates `sys.version_info` branches and stdlib
# availability against 3.10 on EVERY runner, so a 3.11+ symbol is a gate
# failure on the 3.12 job rather than a runtime break on the 3.10 one. This
# must stay equal to the lowest version in `requires-python` and the CI matrix;
# tests/conformance/test_platform_contract.py asserts that they agree.
python_version = 3.10
mypy_path = src:scripts:tests/conformance:tests/chokepoint
explicit_package_bases = True
ignore_missing_imports = False
warn_unused_ignores = True
warn_redundant_casts = True
files = src/prometheus_protocol, scripts, tests
